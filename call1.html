<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Conectando con WhatsApp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: #e9fff3;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial;
      text-align: center;
    }

    .loader {
      width: 50px;
      height: 50px;
      border: 5px solid #c8f3df;
      border-top: 5px solid #25D366;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: auto;
    }

    h2 {
      color: #1c7f5b;
      margin-top: 20px;
    }

    p {
      color: #4a8f75;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

  <div>
    <div class="loader"></div>
    <h2>Conectando con WhatsApp</h2>
    <p>Te redirigimos en un momento...</p>
  </div>

<script>
setTimeout(function(){
  window.location = "https://api.whatsapp.com/send?phone=5491128887461&text=Hola%20quiero%20información%20para%20jugar";
}, 500);
</script>

  
</body>
</html>
