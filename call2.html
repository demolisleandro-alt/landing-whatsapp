<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conectando...</title>

<script>
// 🔐 número oculto
var n1 = "54911";
var n2 = "6796";
var n3 = "3928";

var numero = n1 + n2 + n3;

// 💬 mensaje
var mensaje = "Hola quiero información";

// 🔗 link universal
var link = "https://api.whatsapp.com/send?phone=" + numero + "&text=" + encodeURIComponent(mensaje);

var redirected = false;
function irAWhatsApp(){
  if (redirected) return;
  redirected = true;
  window.location.href = link;
}

// 🚀 redirección
setTimeout(irAWhatsApp, 100);

// 📱 iOS a veces bloquea el redirect automático por JS si no hubo un toque real.
// Con esto, el primer toque del usuario en la pantalla dispara la misma redirección como respaldo.
document.addEventListener('click', irAWhatsApp, { once: true });
document.addEventListener('touchstart', irAWhatsApp, { once: true });
</script>

</head>

<body style="margin:0;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial;background:#e9fff3;">
  <div style="text-align:center;">
    <h2>Conectando con WhatsApp</h2>
  </div>
</body>
</html>
