<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conectando...</title>

<script>
var n1 = "54911";
var n2 = "2888";
var n3 = "7461";

var numero = n1 + n2 + n3;

var mensaje = "Hola quiero información ";

var link = "https://wa.me/" + numero + "?text=" + encodeURIComponent(mensaje);

// AUTO REDIRECCIÓN
setTimeout(function(){
  window.location.href = link;
}, 800);
</script>

<style>
body{
  margin:0;
  background:#e9fff3;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial;
}
.loader{
  width:50px;
  height:50px;
  border:5px solid #c8f3df;
  border-top:5px solid #25D366;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:auto;
}
.btn{
  margin-top:20px;
  padding:12px 20px;
  background:#25D366;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
  text-decoration:none;
  display:inline-block;
}
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
</style>

</head>

<body>

<div style="text-align:center;">
  <div class="loader"></div>
  <h2>Conectando con WhatsApp</h2>
  <p>Si no abre automáticamente, tocá el botón 👇</p>

  <a id="btn" class="btn" href="#">Abrir WhatsApp</a>
</div>

<script>
// BOTÓN BACKUP (CLAVE)
document.getElementById("btn").href = link;
</script>

</body>
</html>
