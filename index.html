<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Conectando con WhatsApp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0; background:#e9f7ef; display:flex; justify-content:center; align-items:center; height:100vh; font-family:Arial, sans-serif;">
  <div style="text-align:center;">
    <div style="width:50px; height:50px; border:5px solid #b6e2c6; border-top:5px solid #25d366; border-radius:50%; margin:0 auto 20px; animation:spin 1s linear infinite;"></div>

    <p style="color:#2ecc71;">Te redirigiremos en un momento</p>
  </div>

  <script>
    setTimeout(function () {
      window.location.href = "https://wa.me/5491130338153?text=Hola%2C%20quiero%20acceder%20a%20la%20oferta%20inicial";
    }, 1200);
  </script>

  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</body>
</html>
